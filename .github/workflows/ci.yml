name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量集成测试（隔离/饱和/超时/熔断）
        run: mvn -B test
      - name: 工件自检
        run: bash scripts/check_artifacts.sh
