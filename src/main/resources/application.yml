server:
  port: 18080
  tomcat:
    threads:
      max: 200        # Spring Boot 默认值；压测算术的分母（问题报告 RST-001）
    accept-count: 100

ai:
  mode: baseline      # 默认基线：`mvn spring-boot:run` 即复现线程池耗尽；fixed 见 scripts/
  llm:
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:glm-4-flash}
    connect-timeout-ms: 3000
    read-timeout-ms: 12000
    deferred-result-timeout-ms: 15000
    max-tokens: 0            # 0=不限制；>0 时请求带 max_tokens（延迟/成本旋钮）
  pool:
    core: 8
    max: 16
    queue-capacity: 50
  breaker:                   # 研究后可配：对不同延迟量级的依赖需不同半开节奏
    failure-rate-threshold: 50
    sliding-window-size: 8
    minimum-number-of-calls: 4
    wait-duration-in-open-state-ms: 2000
    permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.resumeai.stability: INFO
